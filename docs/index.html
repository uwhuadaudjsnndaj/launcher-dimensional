<meta name="description" content="Dimensional Studio: estudio de eventos de Minecraft. Descarga el launcher y entra a nuestros servidores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Concepto: el escenario de un evento. Fondo casi negro, focos rojos sobre el logo,
   entradas (tickets) para cada servidor y una cinta de letrero en movimiento. */
:root {
  --bg: #07070a;
  --surface: #0f0e12;
  --surface-2: #16141a;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #f5f3f4;
  --muted: #a39da3;
  --faint: #6f6a72;
  --accent: #d4141f;
  --accent-hi: #f0252f;
  --accent-lo: #7a0a0f;
  --accent-text: #ff6670;
  --ok: #34d399;
  --radius: 16px;
  --display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --body: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; padding-inline: 20px; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px; border-radius: 6px; }
.glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(50% 42% at 88% -8%, rgba(212, 20, 31, 0.26), transparent 70%), radial-gradient(42% 36% at 4% 108%, rgba(212, 20, 31, 0.14), transparent 70%); }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin-inline: auto; }
.label { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-text); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { width: 38px; height: 38px; object-fit: contain; }
.brand span { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
.nav-links { display: flex; align-items: center; gap: 26px; margin-left: auto; margin-right: 16px; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .2s; }
.nav-links a:hover { color: var(--text); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 26px; border-radius: 12px; border: 1px solid transparent; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .3px; text-decoration: none; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s, border-color .2s; }
.btn-primary { color: #fff; background: linear-gradient(135deg, var(--accent-hi), var(--accent-lo)); box-shadow: 0 10px 30px rgba(212, 20, 31, .35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(240, 37, 47, .5); }
.btn-ghost { color: var(--text); background: rgba(255,255,255,.04); border-color: var(--line-strong); }
.btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(240,37,47,.6); transform: translateY(-2px); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.hero { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 40px; padding-block: 48px 64px; }
.hero-text { min-width: 0; animation: fade-up .7s ease both; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 6.2vw, 68px); line-height: 1.04; letter-spacing: -1px; text-wrap: balance; margin-top: 18px; }
.hero h1 em { font-style: normal; background: linear-gradient(135deg, var(--accent-hi), #ff8a92); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); font-size: 18px; max-width: 46ch; margin-top: 20px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

/* Escenario con focos */
.stage { position: relative; aspect-ratio: 1; width: 100%; max-width: 440px; justify-self: center; display: grid; place-items: center; overflow: hidden; border-radius: 28px; animation: fade-up .7s .15s ease both;
  background: radial-gradient(60% 50% at 50% 100%, rgba(212,20,31,.28), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)); border: 1px solid var(--line); }
.stage img { position: relative; width: 66%; height: 66%; object-fit: contain; margin-top: 6%; animation: float 6s ease-in-out infinite; }
.beam { position: absolute; top: -6%; width: 52%; height: 96%; transform-origin: 50% 0; filter: blur(5px);
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(240,37,47,.12) 45%, transparent 90%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
.beam.l { left: -4%; animation: sway-l 7s ease-in-out infinite; }
.beam.r { right: -4%; animation: sway-r 7s ease-in-out infinite; }
.floor { position: absolute; left: 12%; right: 12%; bottom: 7%; height: 10%; border-radius: 50%; background: radial-gradient(ellipse, rgba(240,37,47,.55), transparent 70%); filter: blur(10px); animation: breathe 4s ease-in-out infinite; }

/* Cinta de letrero */
.ticker { overflow: hidden; border-block: 1px solid var(--line); background: rgba(255,255,255,.02); }
.ticker-track { display: flex; width: max-content; animation: marquee 32s linear infinite; }
.ticker span { display: inline-flex; align-items: center; gap: 28px; padding: 14px 28px 14px 0; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.ticker span::after { content: ""; width: 7px; height: 7px; background: var(--accent-hi); transform: rotate(45deg); }

section { padding-block: 64px; }
section + section { border-top: 1px solid var(--line); }
.head { max-width: 56ch; margin-bottom: 36px; }
.head h2 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.5px; line-height: 1.12; margin-top: 12px; text-wrap: balance; }
.head p { color: var(--muted); margin-top: 12px; }

/* Entradas (servidores) */
.servers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.ticket { position: relative; min-width: 0; overflow: hidden; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  transition: transform .25s, filter .25s; animation: fade-up .6s ease both; }
.ticket:nth-child(2) { animation-delay: .08s; }
.ticket.live:hover { transform: translateY(-4px); filter: drop-shadow(0 0 22px rgba(212,20,31,.4)); }
.banner { position: relative; height: 150px; display: flex; align-items: flex-start; padding: 12px;
  background: linear-gradient(180deg, transparent 45%, var(--surface) 100%),
    radial-gradient(circle, rgba(255,255,255,.7) 1.6px, transparent 2.3px) 6px 10px / 47px 47px,
    radial-gradient(circle, rgba(255,255,255,.4) 1.1px, transparent 1.8px) 24px 30px / 31px 31px,
    radial-gradient(circle, rgba(255,255,255,.25) 0.9px, transparent 1.5px) 3px 21px / 19px 19px,
    radial-gradient(120% 140% at 85% 120%, rgba(0,0,0,.5), transparent 60%),
    linear-gradient(135deg, var(--a1), var(--a2)); }
.ticket.soon .banner { filter: saturate(.4) brightness(.8); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(8,7,10,.68); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.on::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.6s ease-in-out infinite; }
.ticket-body { padding: 18px 22px 24px; border-top: 2px dashed var(--line-strong); }
.ticket h3 { font-family: var(--display); font-weight: 700; font-size: 20px; }
.ticket p { color: var(--muted); font-size: 15px; margin-top: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }

.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.feature { min-width: 0; padding: 22px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); transition: border-color .25s, transform .25s; }
.feature:hover { border-color: var(--line-strong); transform: translateY(-3px); }
.feature svg { width: 26px; height: 26px; fill: none; stroke: var(--accent-hi); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.feature h3 { font-family: var(--display); font-weight: 700; font-size: 16px; margin-top: 14px; }
.feature p { color: var(--muted); font-size: 14.5px; margin-top: 6px; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; counter-reset: s; }
.step { min-width: 0; padding: 24px 22px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--line); counter-increment: s; }
.step::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; font-family: var(--display); font-weight: 800; background: linear-gradient(135deg, var(--accent-hi), var(--accent-lo)); }
.step h3 { font-family: var(--display); font-weight: 700; font-size: 16px; margin-top: 16px; }
.step p { color: var(--muted); font-size: 14.5px; margin-top: 6px; }
.req { margin-top: 24px; font-size: 14px; color: var(--faint); }
.req strong { color: var(--muted); font-weight: 600; }
footer { padding-block: 36px 48px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 50% { opacity: .55; transform: scale(.94); } }
@keyframes float { 50% { transform: translateY(-10px) rotate(1.5deg); } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes sway-l { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(7deg); } }
@keyframes sway-r { 0%,100% { transform: rotate(9deg); } 50% { transform: rotate(-7deg); } }
@keyframes marquee { to { transform: translateX(-33.333%); } }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; padding-block: 28px 48px; }
  .stage { max-width: 300px; order: -1; justify-self: start; }
  .nav-links { display: none; }
  section { padding-block: 48px; }
}
@media (max-width: 420px) { .brand span { font-size: 11px; letter-spacing: 2px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* --- Puerta de acceso con Discord --- */
.gate { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 32px; }
.gate[hidden] { display: none; }
.gate-box { width: 100%; max-width: 440px; text-align: center; padding: 40px 32px; border-radius: 22px; border: 1px solid var(--line-strong); background: radial-gradient(80% 90% at 50% 0%, rgba(212,20,31,.22), transparent 70%), var(--surface); animation: fade-up .6s ease both; }
.gate-box img { width: 120px; height: 120px; object-fit: contain; animation: float 6s ease-in-out infinite; }
.gate-box h1 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }
.gate-box p { color: var(--muted); margin-top: 10px; font-size: 15px; }
.gate-box .btn { width: 100%; margin-top: 26px; background: #5865f2; box-shadow: 0 10px 30px rgba(88,101,242,.35); color: #fff; }
.gate-box .btn:hover { background: #6b77f5; transform: translateY(-2px); }
.gate-box .btn[disabled] { opacity: .6; cursor: progress; transform: none; }
.gate-err { color: #ff6b7d; font-size: 14px; margin-top: 14px; min-height: 1.4em; }
.gate-foot { color: var(--faint); font-size: 12.5px; margin-top: 18px; }
.user { display: none; align-items: center; gap: 10px; padding: 5px 6px 5px 5px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); }
.user.show { display: flex; }
.user img { border-radius: 50%; object-fit: cover; }
.user-text { display: grid; line-height: 1.15; min-width: 0; }
.user-text b { font-size: 13px; font-weight: 600; max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-text span { font-size: 11.5px; color: var(--faint); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-out { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: color .2s, background .2s; }
.user-out:hover { color: var(--text); background: rgba(255,255,255,.1); }
@media (max-width: 560px) { .user-text { display: none; } .nav { flex-wrap: wrap; } }
</style>
</head>

<script>
(function () {
  // Mismos datos que config.json del launcher
  var CLIENT_ID = '1553965034844069980';
  var REQUIRED_GUILD_ID = ''; // opcional: ID del servidor de Discord obligatorio
  var gate = document.getElementById('gate');
  var errEl = document.getElementById('gate-err');
  var btn = document.getElementById('login');

  function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function showErr(m) { errEl.textContent = m || ''; }
  var redirect = location.origin + location.pathname;

  function login() {
    var arr = new Uint8Array(16); crypto.getRandomValues(arr);
    var state = Array.prototype.map.call(arr, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    store('ds_state', state);
    var scope = REQUIRED_GUILD_ID ? 'identify guilds' : 'identify';
    location.href = 'https://discord.com/oauth2/authorize?client_id=' + encodeURIComponent(CLIENT_ID) +
      '&response_type=token&redirect_uri=' + encodeURIComponent(redirect) +
      '&scope=' + encodeURIComponent(scope) + '&state=' + state;
  }

  function api(path, token) {
    return fetch('https://discord.com/api/v10' + path, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  function avatarOf(u) {
    if (u.avatar) return 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png?size=64';
    return 'https://cdn.discordapp.com/embed/avatars/' + Number((BigInt(u.id) >> 22n) % 6n) + '.png';
  }

  function enter(u) {
    var app = document.getElementById('app');
    app.appendChild(document.getElementById('site').content.cloneNode(true));
    gate.hidden = true;
    var chip = document.getElementById('user');
    document.getElementById('user-avatar').src = avatarOf(u);
    document.getElementById('user-name').textContent = u.global_name || u.username;
    document.getElementById('user-handle').textContent = '@' + u.username;
    chip.classList.add('show');
    document.getElementById('logout').addEventListener('click', function () {
      store('ds_token', null); store('ds_exp', null); location.replace(redirect);
    });
  }

  function check(token) {
    btn.disabled = true; btn.textContent = 'Verificando…'; showErr('');
    return api('/users/@me', token).then(function (u) {
      if (!REQUIRED_GUILD_ID) return u;
      return api('/users/@me/guilds', token).then(function (gs) {
        if (!gs.some(function (g) { return g.id === REQUIRED_GUILD_ID; })) throw new Error('guild');
        return u;
      });
    }).then(enter).catch(function (e) {
      store('ds_token', null); store('ds_exp', null);
      btn.disabled = false; btn.textContent = 'Continuar con Discord';
      showErr(e.message === 'guild' ? 'Debes ser miembro del Discord de Dimensional Studio para entrar.' : 'No se pudo verificar tu sesión. Inténtalo de nuevo.');
    });
  }

  btn.addEventListener('click', login);

  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  if (query.get('error') || hash.get('error')) {
    history.replaceState(null, '', redirect);
    showErr('Inicio de sesión cancelado o denegado.');
    return;
  }
  if (hash.get('access_token')) {
    var ok = hash.get('state') && hash.get('state') === load('ds_state');
    var token = hash.get('access_token');
    var ttl = Number(hash.get('expires_in')) || 3600;
    history.replaceState(null, '', redirect);
    store('ds_state', null);
    if (!ok) { showErr('La autorización no es válida. Inténtalo de nuevo.'); return; }
    store('ds_token', token); store('ds_exp', String(Date.now() + ttl * 1000));
    check(token);
    return;
  }
  var saved = load('ds_token');
  if (saved && Number(load('ds_exp')) > Date.now()) check(saved);
})();
</script>
